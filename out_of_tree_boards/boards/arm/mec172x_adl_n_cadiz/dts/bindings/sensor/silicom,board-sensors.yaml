description: |
  Board hwmon sensor aggregation node for mec172x_adl_n_cadiz.

  This node carries no hardware of its own: it just lists, per hwmon class,
  which already-declared sensor channels are reported to the host and in
  what order. drivers/sensors.c reads it via silicom_board_sensors instead
  of enumerating every enabled node of a given compatible (voltage-divider,
  current-sense-amplifier, ntc-thermistor) directly, so board membership and
  host reporting order are explicit here rather than implied by devicetree
  node order.

compatible: "silicom,board-sensors"

properties:
  board-die-temp-sensors:
    type: phandles
    description: |
      Switch/VRM die temperature sensor channels (hwmon "temp" class),
      reported to the host in this order.

  board-amb-temp-sensors:
    type: phandles
    description: |
      Board-ambient temperature sensor channels (hwmon "temp" class),
      reported to the host in this order.

  board-volt-sensors:
    type: phandles
    description: |
      Rail voltage sensor channels (hwmon "in" class), reported to the host
      in this order.

  board-curr-sensors:
    type: phandles
    description: |
      Rail current sensor channels (hwmon "curr" class), reported to the
      host in this order.

  board-powr-sensors:
    type: phandles
    description: |
      PSU input power sensor channels (hwmon "power" class), reported to
      the host in this order.

  board-peci-temp-sensor:
    type: phandle
    description: |
      Device used to read CPU die temperature into hwmon_sram's dedicated
      "peci" struct (a single hwmon "temp" entry, distinct from the mon[]
      array the other board-*-sensors properties above populate). Two
      mutually exclusive mechanisms exist in this codebase, selected in
      drivers/sensors.c: a normal Zephyr sensor-model driver
      (../zephyr/drivers/sensor/x86_peci_temp, compatible "x86-peci-temp")
      read like the phandles properties above via sensor_sample_fetch/
      channel_get -- point this at that node, as this board (cadiz) does --
      or, on a board built with CONFIG_PECI_OVER_ESPI_ENABLE instead,
      drivers/peci_hub.c's own PECI-over-eSPI OOB implementation, which
      resolves its own PECI bus device internally and so does not actually
      use this phandle's target; it only gates whether PECI CPU temp is
      reported at all.
