# Fall back to thermal management V4 (Falcon die temperature, Beny 60-64C fan
# curve) instead of the V6 MHO200 adaptive ambient profile that prj.conf now
# selects by default.
#
#   west build -b mec172x_adl_n_cp -S mho-200 -p always . \
#       -- -DEXTRA_CONF_FILE=thermal_v4.conf
#
# V6 must be turned off explicitly: every thermal management version exports the
# same thread entry point, so only one may be enabled at a time.
CONFIG_THERMAL_MANAGEMENT_V6=n
CONFIG_THERMAL_MANAGEMENT_V4=y

# V4-only knob. Lives here rather than in prj.conf because V6 has no negative
# hysteresis to configure - its anti-chatter is the two-cycle wait before the
# first step down - and an unsatisfied assignment in the shared prj.conf would
# warn on every default build.
CONFIG_THERMAL_MGMT_NEGATIVE_HYSTERESIS=0
