# SPDX-License-Identifier: Apache-2.0
#
# Zephyr's standard compliance suite (scripts/ci/check_compliance.py from the
# Zephyr tree), the same tool upstream zephyrproject-rtos/zephyr runs on every
# PR, covering Checkpatch, Gitlint, devicetree bindings, pylint, etc. See
# https://docs.zephyrproject.org/latest/contribute/guidelines.html
#
# Kconfig, KconfigBasic and KconfigBasicNoModules are excluded: they check the
# Kconfig tree of the zephyr-silicom fork this repo's west.yml points at, not
# this repo's own files, and are not diff-scoped the way the other checks are
# - the same reason upstream Zephyr's own compliance workflow excludes
# KconfigBasic.

name: Compliance Checks

on: pull_request

permissions:
  contents: read

jobs:
  check_compliance:
    runs-on: ubuntu-22.04
    name: Run compliance checks on patch series (PR)
    steps:
      - name: Update PATH for west
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/compliance.yml') }}

      - name: Install python dependencies
        run: |
          pip3 install setuptools
          pip3 install wheel
          pip3 install python-magic lxml junitparser gitlint pylint pykwalify yamllint
          pip3 install west

      - name: west setup
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
          # Ensure there's no merge commits in the PR
          [[ "$(git rev-list --merges --count origin/${BASE_REF}..)" == "0" ]] || \
          (echo "::error ::Merge commits not allowed, rebase instead"; false)
          west init -l . || true
          west update -o=--depth=1 -n

      - name: Run Compliance Tests
        continue-on-error: true
        id: compliance
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          export ZEPHYR_BASE="$PWD/../zephyr"
          "$ZEPHYR_BASE/scripts/ci/check_compliance.py" --annotate \
            -e Kconfig -e KconfigBasic -e KconfigBasicNoModules \
            -c origin/${BASE_REF}..

      - name: upload-results
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: compliance.xml
          path: compliance.xml

      - name: check-warns
        run: |
          if [[ ! -s "compliance.xml" ]]; then
            exit 1
          fi

          export ZEPHYR_BASE="$PWD/../zephyr"
          files=($("$ZEPHYR_BASE/scripts/ci/check_compliance.py" -l))
          for file in "${files[@]}"; do
            f="${file}.txt"
            if [[ -s $f ]]; then
              errors=$(cat "$f")
              errors="${errors//'%'/'%25'}"
              errors="${errors//$'\n'/'%0A'}"
              errors="${errors//$'\r'/'%0D'}"
              echo "::error file=${f}::$errors"
              exit=1
            fi
          done

          if [ "${exit}" == "1" ]; then
            exit 1
          fi
