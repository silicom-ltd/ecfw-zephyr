description: |
  Links one trip (see thermal-fan-ctrl-v5-trip.yaml) to the cooling
  device(s) it drives, as a child of a "thermal-fan-ctrl-v5" zone's
  "cooling-maps" container - modeled on Linux/Zephyr thermal-zones
  cooling-maps.

  Each cooling-device entry is <&cooling_device min max> (see
  thermal-fan-ctrl-v5-cooling-device.yaml): min/max are cooling-state
  indices into that device's own cooling-levels array. thermalmgmt.c
  applies "max" once the temperature crosses above this map's trip, and
  "min" once it falls back below it (each direction independently
  debounced). A map may list multiple cooling-device entries to drive
  several fans off of the one trip.

compatible: "thermal-fan-ctrl-v5-cooling-map"

properties:
  trip:
    type: phandle
    required: true
    description: The trip (thermal-fan-ctrl-v5-trip node) this map applies to.

  cooling-device:
    type: phandle-array
    required: true
    specifier-space: cooling
    description: |
      Cooling device(s) driven once the referenced trip is crossed, each
      as <&device min-state max-state>.
