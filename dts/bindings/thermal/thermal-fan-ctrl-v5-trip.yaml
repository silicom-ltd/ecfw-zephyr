description: |
  One temperature trip point, as a child of a "thermal-fan-ctrl-v5" zone's
  "trips" container. Modeled on Linux/Zephyr thermal-zones trip points.

  Trips are evaluated independently: each poll, thermalmgmt.c checks every
  trip against the current temperature and applies whichever
  "thermal-fan-ctrl-v5-cooling-map" node(s) reference it (see
  thermal-fan-ctrl-v5-cooling-map.yaml) - a trip does not need to be part
  of a single ordered curve, so different trips can drive different
  cooling devices with an arbitrary temperature-to-cooling-device mapping.

compatible: "thermal-fan-ctrl-v5-trip"

properties:
  temperature:
    type: int
    required: true
    description: Trip temperature, in degrees Celsius.
