description: |
  Thermal management V5 fan-curve zone (app/thermal_management_v5), shaped
  like a Linux/Zephyr thermal-zones node: a zone with sensors, child
  "trips" (temperature thresholds) and child "cooling-maps" (trip ->
  cooling device(s), each an independently-tabled fan - see
  thermal-fan-ctrl-v5-cooling-device.yaml).

  Trips are evaluated independently, not as one ordered curve: each poll,
  thermalmgmt.c checks every trip against the current temperature and
  applies whichever cooling-map(s) reference it. This allows an arbitrary
  temperature-to-cooling-device mapping - different trips can drive
  different fans, and the same fan can be driven by more than one trip.

  There should be exactly one enabled node with this compatible per board,
  normally placed under a plain (compatible-less) "thermal-zones" container
  node, matching the upstream convention:

    / {
            fan1-1-cooling: fan1-1-cooling {
                    compatible = "thermal-fan-ctrl-v5-cooling-device";
                    #cooling-cells = <2>;
                    fan-devices = <&fan1_1>;
                    cooling-levels = <40 45 50>;
            };

            thermal-zones {
                    fan-ctrl-v5: fan-ctrl-v5 {
                            compatible = "thermal-fan-ctrl-v5";
                            thermal-sensors = <&switch_temp0>, <&switch_temp1>;

                            trips {
                                    trip_0: trip-0 {
                                            compatible = "thermal-fan-ctrl-v5-trip";
                                            temperature = <20>;
                                    };
                            };

                            cooling-maps {
                                    map_0: map-0 {
                                            compatible = "thermal-fan-ctrl-v5-cooling-map";
                                            trip = <&trip_0>;
                                            cooling-device = <&fan1_1_cooling 0 1>;
                                    };
                            };
                    };
            };
    };

compatible: "thermal-fan-ctrl-v5"

properties:
  thermal-sensors:
    type: phandles
    required: true
    description: |
      Temperature sensor devices read every cycle; the fan curve is
      driven off the max SENSOR_CHAN_DIE_TEMP reading across all of them.

  fan-temp-filter:
    type: int
    description: |
      Moving-average filter window width, in samples; defaults to 5 if
      unset (applied in thermalmgmt.c via DT_PROP_OR, not by this
      binding - a binding-level "default" would make this property
      synthesize as present even when unset in the devicetree, which
      would break the fan-temp-ema-alpha mutual-exclusivity check
      below). This is the default filter; ignored if fan-temp-ema-alpha
      is set instead.

  fan-temp-ema-alpha:
    type: int
    description: |
      Selects the exponential-moving-average filter instead of the
      moving average. Value is the weight given to the newest sample,
      as a percentage - must be between 1 and 100, and mutually
      exclusive with fan-temp-filter; both are enforced by a
      BUILD_ASSERT in thermalmgmt.c, not by this binding (the
      devicetree binding schema has no numeric range/exclusivity
      constraint of its own).
