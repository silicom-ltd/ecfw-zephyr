# CPU die temperature is only reportable on boards whose board-sensors
# devicetree node declares board-peci-temp-sensor -- enable per-board here,
# not in prj.conf, since drivers/sensors.c's peci_temp_init()/update() don't
# exist to link against otherwise.
CONFIG_PECI_MONITOR=y
CONFIG_PECI_MONITOR_LOG_LEVEL=2

# This board's devicetree enumerates an x86-peci-temp node, so
# PECI_OVER_ESPI_ENABLE (prj.conf's default) is unavailable here --
# depends on !DT_HAS_X86_PECI_TEMP_ENABLED (app/thermal_management/Kconfig).
# Override the inherited default explicitly, matching mec172x_adl_n.conf /
# mec172x_azbeach.conf, so Kconfig doesn't warn about an assignment that
# can't take effect.
CONFIG_PECI_OVER_ESPI_ENABLE=n
