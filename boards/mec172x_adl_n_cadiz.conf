# CPU die temperature is only reportable on boards whose board-sensors
# devicetree node declares board-peci-temp-sensor -- enable per-board here,
# not in prj.conf, since drivers/sensors.c's peci_temp_init()/update() don't
# exist to link against otherwise.
CONFIG_PECI_MONITOR=y
CONFIG_PECI_MONITOR_LOG_LEVEL=2
