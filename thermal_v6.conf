# Build the MHO200 adaptive fan speed profile (thermal management V6) instead
# of V4. V4 stays the default in prj.conf until V6 is validated on the bench.
#
#   west build -b mec172x_adl_n_cp -S mho-200 -p always . \
#       -- -DEXTRA_CONF_FILE=thermal_v6.conf
#
# V4 must be turned off explicitly: every thermal management version exports the
# same thread entry point, and CONFIG_THERMAL_MANAGEMENT_V6 depends on none of
# the others being selected.
#
# Expect one benign Kconfig warning from this build: prj.conf sets
# THERMAL_MGMT_NEGATIVE_HYSTERESIS, a V1/V3/V4 knob that V6 does not have, so
# the assignment goes unsatisfied. The value it sets is the Kconfig default
# anyway, and V6 has no negative hysteresis to configure - the profile's
# anti-chatter is the two-cycle wait before the first step down.
CONFIG_THERMAL_MANAGEMENT_V4=n
CONFIG_THERMAL_MANAGEMENT_V6=y
